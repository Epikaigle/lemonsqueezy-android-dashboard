name = "lemon-dashboard-push"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_YOUR_FIREBASE_PROJECT_ID"
ALLOWED_STORE_IDS = "REPLACE_WITH_YOUR_LEMON_STORE_ID"
