name: Push Worker tests
on:
  push:
    branches: [main]
    paths:
      - "push-worker/**"
      - ".github/workflows/push-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: push-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Security and event unit tests
        run: npm test
