name: Signed Android release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Restore keystore from encrypted GitHub secret
        shell: bash
        env:
          LEMON_KEYSTORE_B64: ${{ secrets.LEMON_KEYSTORE_B64 }}
          LEMON_SIGNING_PASSWORD: ${{ secrets.LEMON_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$LEMON_KEYSTORE_B64" || -z "$LEMON_SIGNING_PASSWORD" ]]; then
            echo "::error::Configure LEMON_KEYSTORE_B64 and LEMON_SIGNING_PASSWORD in Settings > Secrets and variables > Actions"
            exit 1
          fi
          umask 077
          printf '%s' "$LEMON_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lemon-dashboard-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/lemon-dashboard-release.jks" -storepass "$LEMON_SIGNING_PASSWORD" -alias lemon-dashboard-release > /dev/null
      - name: Build signed APK and tests
        env:
          LEMON_KEYSTORE_PATH: ${{ runner.temp }}/lemon-dashboard-release.jks
          LEMON_KEYSTORE_PASSWORD: ${{ secrets.LEMON_SIGNING_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Verify release signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Export signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LemonDashboard-v1.1.0-persistent-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - name: Forget local keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lemon-dashboard-release.jks"
