name: Signed Android release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Restore keystore from encrypted GitHub secret
        shell: bash
        env:
          LEMON_KEYSTORE_B64: ${{ secrets.LEMON_KEYSTORE_B64 }}
          LEMON_SIGNING_PASSWORD: ${{ secrets.LEMON_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$LEMON_KEYSTORE_B64" || -z "$LEMON_SIGNING_PASSWORD" ]]; then
            echo "::error::Configure LEMON_KEYSTORE_B64 and LEMON_SIGNING_PASSWORD in Settings > Secrets and variables > Actions"
            exit 1
          fi
          umask 077
          printf '%s' "$LEMON_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lemon-dashboard-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/lemon-dashboard-release.jks" -storepass "$LEMON_SIGNING_PASSWORD" -alias lemon-dashboard-release > /dev/null
      - name: Restore Firebase Android configuration
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$FIREBASE_ANDROID_CONFIG_JSON" ]]; then
            umask 077
            printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > app/google-services.json
            python3 -m json.tool app/google-services.json >/dev/null
          else
            # Firebase client configuration is already embedded in the previously
            # released APK. Reuse those public client resource values only when
            # the user has not configured the recommended secret yet.
            echo "Firebase secret unavailable: checking previous verified APK client configuration."
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download v1.5.4 --repo "$GITHUB_REPOSITORY" --pattern "app-release.apk" --dir "$RUNNER_TEMP/previous"
            PREVIOUS="$RUNNER_TEMP/previous/app-release.apk"
            SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            SIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
            "$SIGNER" verify "$PREVIOUS"
            FINGERPRINT="$("$SIGNER" verify --print-certs "$PREVIOUS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            EXPECTED="e5eee894f30aa766d9d6bc9a3901c7d955172dd45ed282d331e4e83e8152f908"
            if [[ "$FINGERPRINT" != "$EXPECTED" ]]; then
              echo "::error::Existing release signature is not the expected certificate."
              exit 1
            fi
            "$SDK_ROOT/build-tools/36.0.0/aapt2" dump resources "$PREVIOUS" > "$RUNNER_TEMP/previous/resources.txt"
            python3 .github/scripts/recover-firebase-resources.py "$RUNNER_TEMP/previous/resources.txt" app/src/main/res/values/lemon_firebase_runtime.xml
          fi
      - name: Build signed APK and tests
        env:
          LEMON_KEYSTORE_PATH: ${{ runner.temp }}/lemon-dashboard-release.jks
          LEMON_KEYSTORE_PASSWORD: ${{ secrets.LEMON_SIGNING_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Verify release signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$SIGNER" verify --verbose --print-certs "$APK"
          FINGERPRINT="$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          EXPECTED="e5eee894f30aa766d9d6bc9a3901c7d955172dd45ed282d331e4e83e8152f908"
          if [[ "$FINGERPRINT" != "$EXPECTED" ]]; then
            echo "::error::Signature release incorrecte : empreinte du certificat différente !"
            exit 1
          fi
      - name: Extract App Version
        id: version
        shell: bash
        run: |
          VERSION="$(grep 'versionName =' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Export signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LemonDashboard-${{ steps.version.outputs.tag }}-persistent-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - name: Publish verified signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APK_NAME="LemonDashboard-${TAG}.apk"
          SHA_NAME="${APK_NAME}.sha256"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$SHA_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" "$SHA_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" "$SHA_NAME" --target "$GITHUB_SHA" --title "Lemon Dashboard $TAG" --notes "APK signée officielle avec certificat persistant vérifié (SHA-256 e5eee894f30aa766d9d6bc9a3901c7d955172dd45ed282d331e4e83e8152f908)."
          fi
      - name: Forget local keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lemon-dashboard-release.jks" app/google-services.json
